# =============================================================================
# dsh-data-agent — DeepSeek Harness profile overlay (settings-driven)
# =============================================================================
# Apply with:
#   dsh --profile web --patch ./cordis.patch.yml
#
# Prerequisite: the workspace packages must be resolvable from the profile
# (see README.md "安装方法"):
#   - link packages/<pkg> into $DSH_HOME/profiles/node_modules, or
#   - `dsh plugin --profile web add file:<abs path>/packages/<pkg>` for each.
#
# DATABASE CONNECTIONS ARE CONFIGURED IN THE WEB UI, not in this file:
# the settings page renders the `data-query-sources` namespace (sourceId /
# dialect / host / port / user / password / database / default flag), and
# changes apply LIVE — no restart, no patch edit.
# -----------------------------------------------------------------------------

- insert:
    # Settings-driven data source manager: mounts ctx.dataQuery, registers the
    # `data-query-sources` settings namespace, instantiates the matching
    # provider backend per configured source (mysql / postgresql), and
    # re-registers them live on every settings change.
    - id: data-query-config
      name: 'dsh-data-query-config'

    # Consumer: exposes `data_query` to the agent (routes by `source`).
    - id: tool-data-query
      name: 'dsh-tool-data-query'

    # Consumer: exposes `generate_chart` to the agent.
    - id: tool-echarts
      name: 'dsh-tool-echarts'
